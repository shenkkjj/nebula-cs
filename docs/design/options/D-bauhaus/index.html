<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 D: 构成主义工作台 / 星云客服</title>
<meta name="description" content="星云客服方案 D 构成主义工作台静态原型，含保修样例问答与引用盖章。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
/* Hallmark · v2.0.0 · theme: custom (by request) · shape: app screen · genre: technical · posture: full-palette · surface: absolute · hero: settled · nav: left icon rail · footer: none · job: answer · signature: numbered citation stamps · axes: bauhaus grid + primary blocks */
/* Hallmark · waive 3 · thick black partitions · Bauhaus/Mondrian grid requires heavy rules as structure, not chrome accent */
/* Hallmark · waive 7b · pure white fields · primary red/blue/yellow system needs paper white as third neutral */
/* Hallmark · waive 26b · prototype static controls · design option mock has no disabled forms yet */
/* Hallmark · answered F3 · text-wrap balance added on display heads */
/* Hallmark · answered F23 · meta description added */
:root {
  --red: #e30613;
  --blue: #0057b8;
  --yellow: #ffd100;
  --ink: #0a0a0a;
  --paper: #f7f4ec;
  --mute: #4a4a4a;
  --line: #0a0a0a;
  --white: #faf8f2;
  --rail: #0a0a0a;
  --font-display: "Archivo Black", "Arial Black", sans-serif;
  --font-body: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --space: 8px;
  --max: 1180px;
  --radius: 0;
  --hatch: rgba(10, 10, 10, 0.02);
  --on-red: #fff8e7;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: clip; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.45;
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(var(--ink) 1px, transparent 1px),
    linear-gradient(90deg, var(--ink) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.06;
}
:focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 2px;
}
button:active, .composer .send:active, .composer .human:active { filter: brightness(0.92); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.shell {
  position: relative; z-index: 1;
  max-width: var(--max); margin: 0 auto;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  border-left: 3px solid var(--ink);
  border-right: 3px solid var(--ink);
  background: var(--paper);
}
.rail {
  background: var(--rail); color: var(--paper);
  display: flex; flex-direction: column; align-items: center;
  padding: calc(var(--space) * 2) 0; gap: calc(var(--space) * 1.5);
  border-right: 3px solid var(--ink);
}
.rail .mark {
  width: 40px; height: 40px; background: var(--yellow); color: var(--ink);
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 18px; line-height: 1;
}
.rail button {
  width: 40px; height: 40px; border: 2px solid var(--white);
  background: transparent; color: var(--paper); cursor: pointer;
  display: grid; place-items: center; padding: 0;
}
.rail button.active { background: var(--red); border-color: var(--red); }
.rail button svg { width: 18px; height: 18px; }
.rail .spacer { flex: 1; }
.main {
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  min-height: 100vh; min-width: 0;
}
.banner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: stretch;
  border-bottom: 3px solid var(--ink);
}
.banner-title {
  padding: calc(var(--space) * 2) calc(var(--space) * 3);
  background: var(--white);
}
.banner-title h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 2.4vw, 2rem);
  letter-spacing: -0.02em;
  overflow-wrap: break-word; min-width: 0;
  text-wrap: balance;
}
.banner-title p {
  margin: 4px 0 0;
  font-size: 0.88rem; color: var(--mute);
}
.blocks {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  min-width: 0;
}
.blocks > div {
  display: flex; align-items: center; justify-content: center;
  padding: 0 calc(var(--space) * 2);
  font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500;
  border-left: 3px solid var(--ink); color: var(--ink);
}
.blocks .b1 { background: var(--red); color: var(--on-red); }
.blocks .b2 { background: var(--blue); color: var(--paper); }
.blocks .b3 { background: var(--yellow); }
.faq-heading {
  margin: 0; padding: 8px 16px 0; font-size: 0.8rem; font-weight: 600; color: var(--mute);
}
.faq-wrap { border-bottom: 3px solid var(--ink); }
.faq {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.faq button {
  font: inherit; font-size: 0.82rem; font-weight: 600;
  text-align: left; cursor: pointer;
  padding: calc(var(--space) * 1.5) calc(var(--space) * 2);
  border: none; border-right: 3px solid var(--ink);
  background: var(--white); color: var(--ink);
  min-height: 64px;
}
.faq button:last-child { border-right: none; }
.faq button.active { background: var(--yellow); }
.faq button:hover { background: var(--paper); }
.faq button.active:hover { background: var(--yellow); }
.stage {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.9fr);
  min-height: 0;
}
.chat {
  padding: calc(var(--space) * 2.5);
  border-right: 3px solid var(--ink);
  display: flex; flex-direction: column; gap: calc(var(--space) * 2);
  background:
    repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 10px,
      var(--hatch) 10px,
      var(--hatch) 11px
    );
}
.bubble {
  max-width: 92%;
  border: 3px solid var(--ink);
  padding: calc(var(--space) * 1.75) calc(var(--space) * 2);
  background: var(--white);
  font-size: 0.95rem;
}
.bubble.user {
  align-self: flex-end;
  background: var(--blue);
  color: var(--paper);
}
.bubble.bot strong { background: var(--yellow); padding: 0 4px; color: var(--ink); }
.bubble.refuse { background: var(--paper); border-style: dashed; }
.stamps {
  padding: calc(var(--space) * 2.5);
  background: var(--white);
  display: flex; flex-direction: column; gap: calc(var(--space) * 2);
}
.stamps h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1rem;
  overflow-wrap: break-word; min-width: 0;
  text-wrap: balance;
}
.stamp {
  border: 3px solid var(--ink);
  padding: calc(var(--space) * 1.5);
  position: relative;
  background: var(--paper);
}
.stamp .num {
  position: absolute; top: -12px; left: 12px;
  width: 28px; height: 28px;
  background: var(--red); color: var(--on-red);
  border: 3px solid var(--ink);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 0.85rem; font-weight: 500;
}
.stamp .src { font-weight: 700; font-size: 0.88rem; margin: 8px 0 4px; }
.stamp .q { font-size: 0.8rem; color: var(--mute); }
.composer {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
  border-top: 3px solid var(--ink); background: var(--white);
}
.composer input {
  font: inherit; border: none; padding: calc(var(--space) * 2);
  background: transparent; min-width: 0;
}
.composer button {
  font: inherit; font-weight: 700; cursor: pointer;
  border: none; border-left: 3px solid var(--ink);
  padding: 0 calc(var(--space) * 2.5); min-height: 56px;
}
.composer .send { background: var(--red); color: var(--on-red); }
.composer .human { background: var(--yellow); color: var(--ink); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  padding: 8px 16px; font-size: 0.85rem; font-weight: 600;
  opacity: 0; transition: opacity .2s ease; z-index: 5; pointer-events: none;
  border: 3px solid var(--yellow);
}
.toast.show { opacity: 1; }
@media (max-width: 840px) {
  .shell { grid-template-columns: 56px minmax(0, 1fr); }
  .stage, .faq, .blocks { grid-template-columns: 1fr; }
  .faq button, .blocks > div { border-right: none; border-bottom: 3px solid var(--ink); border-left: none; }
  .chat { border-right: none; border-bottom: 3px solid var(--ink); }
}
@media (prefers-reduced-motion: reduce) {
  .toast { transition: none; }
}
</style>
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="主导航">
      <div class="mark" aria-hidden="true">星</div>
      <button type="button" class="active" title="会话" aria-label="会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v10H8l-4 4V6z"/></svg>
      </button>
      <button type="button" title="知识库" aria-label="知识库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h10l4 4v12H5V4z"/><path d="M15 4v4h4"/></svg>
      </button>
      <button type="button" title="工单" aria-label="工单" id="railTicket">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M8 9h8M8 13h5"/></svg>
      </button>
      <div class="spacer"></div>
      <button type="button" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      </button>
    </nav>
    <div class="main">
      <header class="banner">
        <div class="banner-title">
          <h1>星云客服: 构成主义工作台</h1>
          <p>CloudCup Pro / 方案 D / 模拟数据<br />沈凯杰、王瑞康</p>
        </div>
        <div class="blocks" aria-hidden="true">
          <div class="b1">FAQ</div>
          <div class="b2">CHAT</div>
          <div class="b3">CITE</div>
        </div>
      </header>
      <section class="faq-wrap" aria-labelledby="faq-heading"><h2 id="faq-heading" class="faq-heading">快捷问题</h2>
      <div class="faq" id="faq" role="group" aria-label="快捷问题">
        <button type="button" class="active" data-q="保修政策是怎样的？">保修政策是怎样的？</button>
        <button type="button" data-q="如何清洗水杯内胆？">如何清洗水杯内胆？</button>
        <button type="button" data-q="指示灯颜色代表什么？">指示灯颜色代表什么？</button>
        <button type="button" data-q="七天无理由怎么退？">七天无理由怎么退？</button>
      </div></section>
      <div class="stage">
        <section class="chat" aria-label="对话区">
          <div class="bubble user">保修政策是怎样的？</div>
          <div class="bubble bot">
            CloudCup Pro <strong>整机保修 12 个月</strong>；<strong>电池与密封圈 6 个月</strong>。人为损坏、进液、私拆不在保修范围。寄修请带购机凭证。
          </div>
          <div class="bubble refuse">
            知识库里没有可引用依据，已拒答。需要的话转人工继续处理。
            <div style="margin-top:10px">
              <button type="button" class="human" id="btnTicket2" style="font:inherit;font-weight:700;border:3px solid var(--ink);background:var(--yellow);padding:8px 14px;cursor:pointer">转人工</button>
            </div>
          </div>
        </section>
        <aside class="stamps" aria-label="引用来源">
          <h2>出处盖章</h2>
          <div class="stamp">
            <span class="num">01</span>
            <div class="src">客服样例FAQ.md</div>
            <div class="q">相关度 0.86 · 「整机保修期为自购买日起 12 个月；电池与密封圈等耗材保修期为 6 个月。」</div>
          </div>
          <div class="stamp">
            <span class="num">02</span>
            <div class="src">模拟 · 未写入生产库</div>
            <div class="q">本页对话与引用均为静态演示，不请求引擎。</div>
          </div>
        </aside>
      </div>
      <form class="composer" id="composer" onsubmit="return false;">
        <input id="q" type="text" placeholder="输入问题，例如保修、清洗、退换货" autocomplete="off" />
        <button type="button" class="human" id="btnTicket">转人工</button>
        <button type="submit" class="send">发送</button>
      </form>
    </div>
  </div>
  <div class="toast" id="toast">模拟交互</div>
  <script>
    const toast = document.getElementById('toast');
    function ping(m){ toast.textContent=m; toast.classList.add('show'); clearTimeout(window.__t); window.__t=setTimeout(()=>toast.classList.remove('show'),1600); }
    document.getElementById('faq').addEventListener('click', e => {
      const b = e.target.closest('button[data-q]'); if(!b) return;
      document.querySelectorAll('#faq button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); document.getElementById('q').value=b.dataset.q; ping('已选快捷问题（模拟）');
    });
    document.getElementById('composer').onsubmit = () => ping('发送为模拟，未请求引擎');
    ['btnTicket','btnTicket2','railTicket'].forEach(id => {
      const el = document.getElementById(id); if(el) el.onclick = () => ping('转人工演示（模拟）');
    });
  </script>
</body>
</html>
