<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 E: 夜间贵宾席 / 星云客服</title>
<meta name="description" content="星云客服方案 E 夜间贵宾席静态原型，近黑金线与右侧出处抽屉。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Hallmark · v2.0.0 · theme: custom (by request) · shape: app screen · genre: atmospheric · posture: restrained · surface: absolute · hero: settled · nav: top meta · footer: none · job: answer · signature: right silk citation drawer · axes: ink night + champagne */
/* Hallmark · waive 26b · prototype static controls · design option mock has no disabled forms yet */
/* Hallmark · answered F3 · text-wrap balance added on display heads */
/* Hallmark · answered F23 · meta description added */
:root {
  --ink: #0b0c0e;
  --ink-2: #14161a;
  --ink-3: #1c1f26;
  --champagne: #e8dcc4;
  --champagne-soft: #c9ba9a;
  --gold: #b89b5e;
  --gold-line: rgba(184, 155, 94, 0.45);
  --text: #f3ebe0;
  --mute: #9a9080;
  --danger: #c47a6a;
  --font-display: "Cormorant Garamond", "Noto Serif SC", serif;
  --font-body: "Manrope", "PingFang SC", "Microsoft YaHei", sans-serif;
  --space: 8px;
  --max: 1120px;
  --radius: 2px;
  --glow-gold: rgba(184, 155, 94, 0.08);
  --glow-champagne: rgba(232, 220, 196, 0.04);
  --card-fill: linear-gradient(160deg, rgba(232, 220, 196, 0.09), rgba(232, 220, 196, 0.03));
  --user-fill: rgba(184, 155, 94, 0.12);
  --user-line: rgba(184, 155, 94, 0.55);
  --refuse-line: rgba(196, 122, 106, 0.45);
  --silk-sheen: linear-gradient(120deg, transparent 40%, rgba(232, 220, 196, 0.04) 50%, transparent 60%);
  --cite-rule: rgba(184, 155, 94, 0.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: clip; }
body {
  font-family: var(--font-body);
  color: var(--text);
  background: var(--ink);
  line-height: 1.55;
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 70% 50% at 20% 0%, var(--glow-gold), transparent 55%),
    radial-gradient(ellipse 50% 40% at 90% 80%, var(--glow-champagne), transparent 50%);
}
:focus-visible {
  outline: 1px solid var(--gold);
  outline-offset: 3px;
}
button:active, .solid:active, .ghost:active, .composer button:active { filter: brightness(0.94); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.frame {
  position: relative; z-index: 1;
  max-width: var(--max); margin: 0 auto;
  min-height: 100vh;
  padding: calc(var(--space) * 3);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  gap: calc(var(--space) * 2.5);
}
.top {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: calc(var(--space) * 2);
  padding-bottom: calc(var(--space) * 2);
  border-bottom: 1px solid var(--gold-line);
}
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2rem, 3.5vw, 2.75rem);
  letter-spacing: 0.01em;
  color: var(--champagne);
  overflow-wrap: break-word; min-width: 0;
  text-wrap: balance;
}
.brand p {
  margin: 8px 0 0;
  font-size: 0.84rem;
  color: var(--mute);
}
.top-actions {
  display: flex; gap: calc(var(--space) * 1.25); align-items: center; flex-wrap: wrap;
}
.ghost, .solid {
  font: inherit; font-size: 0.82rem; font-weight: 600;
  cursor: pointer; border-radius: var(--radius);
  padding: 0.55rem 1rem;
  transition: border-color .2s ease, background-color .2s ease, color .2s ease;
}
.ghost {
  background: transparent; color: var(--champagne);
  border: 1px solid var(--gold-line);
}
.ghost:hover { border-color: var(--gold); }
.solid {
  background: var(--champagne); color: var(--ink);
  border: 1px solid var(--champagne);
}
.solid:hover { background: var(--champagne-soft); }
.meta {
  font-size: 0.78rem; color: var(--mute);
  border: 1px solid var(--gold-line);
  padding: 0.4rem 0.7rem; border-radius: var(--radius);
}
.faq {
  display: flex; flex-wrap: wrap; gap: calc(var(--space) * 1);
}
.faq button {
  font: inherit; font-size: 0.8rem; cursor: pointer;
  background: transparent; color: var(--champagne-soft);
  border: 1px solid transparent;
  border-bottom: 1px solid var(--gold-line);
  padding: 0.35rem 0.15rem; border-radius: 0;
}
.faq button:hover, .faq button.active {
  color: var(--champagne);
  border-bottom-color: var(--gold);
}
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.85fr);
  gap: calc(var(--space) * 2.5);
  min-height: 0;
}
.lounge {
  background: var(--ink-2);
  border: 1px solid var(--gold-line);
  border-radius: var(--radius);
  padding: calc(var(--space) * 3);
  display: flex; flex-direction: column; gap: calc(var(--space) * 2.25);
  min-width: 0;
}
.msg { max-width: 88%; }
.msg.user { align-self: flex-end; }
.msg .who {
  font-size: 0.72rem; color: var(--mute); margin-bottom: 8px;
}
.msg.user .who { text-align: right; }
.card {
  background: var(--card-fill);
  border: 1px solid var(--gold-line);
  border-radius: var(--radius);
  padding: calc(var(--space) * 2) calc(var(--space) * 2.25);
  color: var(--text);
  font-size: 0.95rem;
}
.msg.user .card {
  background: var(--user-fill);
  border-color: var(--user-line);
}
.card strong { color: var(--champagne); font-weight: 700; }
.card.refuse { border-color: var(--refuse-line); }
.silk {
  background: var(--ink-3);
  border: 1px solid var(--gold-line);
  border-radius: var(--radius);
  padding: calc(var(--space) * 2.5);
  display: flex; flex-direction: column; gap: calc(var(--space) * 2);
  position: relative;
  overflow: clip;
  min-width: 0;
}
.silk::before {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background: var(--silk-sheen);
}
.silk h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.35rem;
  color: var(--champagne);
  overflow-wrap: break-word; min-width: 0;
  text-wrap: balance;
}
.silk .rule {
  height: 1px; background: var(--gold-line); border: none; margin: 0;
}
.cite {
  padding: calc(var(--space) * 1.5) 0;
  border-bottom: 1px solid var(--cite-rule);
}
.cite:last-child { border-bottom: none; }
.cite .t { font-size: 0.88rem; font-weight: 600; color: var(--champagne); }
.cite .s { margin-top: 8px; font-size: 0.8rem; color: var(--mute); }
.composer {
  margin-top: auto;
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: calc(var(--space) * 1);
  padding-top: calc(var(--space) * 1.5);
  border-top: 1px solid var(--gold-line);
}
.composer input {
  font: inherit; color: var(--text);
  background: transparent;
  border: 1px solid var(--gold-line);
  border-radius: var(--radius);
  padding: 0.75rem 1rem; min-width: 0;
}
.composer input::placeholder { color: var(--mute); }
.composer button {
  font: inherit; font-weight: 700; cursor: pointer;
  background: var(--champagne); color: var(--ink);
  border: 1px solid var(--champagne);
  border-radius: var(--radius);
  padding: 0 1.25rem;
}
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink-3); color: var(--champagne);
  border: 1px solid var(--gold);
  padding: 8px 16px; font-size: 0.85rem;
  opacity: 0; transition: opacity .2s ease; z-index: 5; pointer-events: none;
}
.toast.show { opacity: 1; }
@media (max-width: 860px) {
  .workspace { grid-template-columns: 1fr; }
  .top { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  .ghost, .solid, .toast { transition: none; }
}
</style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div class="brand">
        <h1>星云客服</h1>
        <p>夜间贵宾席 / 校园办事 / 方案 E / 模拟<br />沈凯杰、王瑞康</p>
      </div>
      <div class="top-actions">
        <span class="meta">知识库在线</span>
        <button type="button" class="ghost" id="btnTicket">转人工</button>
      </div>
    </header>
    <div class="faq" id="faq" role="group" aria-label="快捷问题">
      <button type="button" class="active" data-q="在读证明如何办理？">在读证明如何办理？</button>
      <button type="button" data-q="图书馆开放时间是什么？">图书馆开放时间是什么？</button>
      <button type="button" data-q="校园网如何认证登录？">校园网如何认证登录？</button>
      <button type="button" data-q="宿舍报修怎么提交？">宿舍报修怎么提交？</button>
    </div>
    <div class="workspace">
      <section class="lounge" aria-label="对话区">
        <div class="msg user">
          <div class="who">同学</div>
          <div class="card">在读证明如何办理？</div>
        </div>
        <div class="msg bot">
          <div class="who">星云客服</div>
          <div class="card">
            在读证明可在<strong>一网通办</strong>提交，<strong>3 个工作日</strong>办结；也可到教务处窗口领取。请携带校园卡，代办需书面委托。
          </div>
        </div>
        <div class="msg bot">
          <div class="who">星云客服</div>
          <div class="card refuse">
            知识库未覆盖该问题，找不到可引用依据，已拒答。建议转人工坐席。
            <div style="margin-top:12px">
              <button type="button" class="solid" id="btnTicket2">转人工坐席</button>
            </div>
          </div>
        </div>
        <form class="composer" id="composer" onsubmit="return false;">
          <input id="q" type="text" placeholder="轻声提问：在读证明、图书馆、校园网…" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
      </section>
      <aside class="silk" aria-label="引用来源">
        <h2>出处</h2>
        <hr class="rule" />
        <div class="cite">
          <div class="t">客服样例FAQ.md / 相关度 0.86</div>
          <div class="s">「在读证明可通过一网通办提交，3 个工作日办结；窗口领取请带校园卡。」</div>
        </div>
        <div class="cite">
          <div class="t">模拟说明</div>
          <div class="s">本页为静态原型，对话与引用不请求业务引擎。</div>
        </div>
      </aside>
    </div>
  </div>
  <div class="toast" id="toast">模拟交互</div>
  <script>
    const toast = document.getElementById('toast');
    function ping(m){ toast.textContent=m; toast.classList.add('show'); clearTimeout(window.__t); window.__t=setTimeout(()=>toast.classList.remove('show'),1600); }
    document.getElementById('faq').addEventListener('click', e => {
      const b = e.target.closest('button[data-q]'); if(!b) return;
      document.querySelectorAll('#faq button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); document.getElementById('q').value=b.dataset.q; ping('已选快捷问题（模拟）');
    });
    document.getElementById('composer').onsubmit = () => ping('发送为模拟，未请求引擎');
    document.getElementById('btnTicket').onclick = () => ping('转人工演示（模拟）');
    document.getElementById('btnTicket2').onclick = () => ping('转人工演示（模拟）');
  </script>
</body>
</html>
