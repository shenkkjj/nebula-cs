<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 E4: 疏夜贵宾席 / 星云客服</title>
<meta name="description" content="星云客服方案 E4：更疏的夜间贵宾席，弱化描边，香槟表面更轻。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Hallmark · v2.0.0 · theme: custom (by request) · shape: app screen · genre: atmospheric · posture: airy · surface: absolute · hero: settled · nav: top meta · footer: none · job: answer · signature: soft champagne air · axes: deep night + soft champagne */
/* Hallmark · waive 26b · prototype static controls · design option mock has no disabled forms yet */
/* Hallmark · answered F3 · text-wrap balance on display heads */
/* Hallmark · answered F23 · meta description added */
:root {
  --ink: #07080a;
  --ink-2: #0e1014;
  --ink-3: #151820;
  --champagne: #ebe3d4;
  --champagne-soft: #c9bfad;
  --gold: #b09a6c;
  --gold-line: rgba(176, 154, 108, 0.18);
  --gold-line-strong: rgba(176, 154, 108, 0.38);
  --text: #f7f2ea;
  --mute: #8a8378;
  --danger: #c9897c;
  --danger-fill: rgba(201, 137, 124, 0.08);
  --font-display: "Cormorant Garamond", "Noto Serif SC", serif;
  --font-body: "Manrope", "PingFang SC", "Microsoft YaHei", sans-serif;
  --space: 8px;
  --max: 1040px;
  --radius: 4px;
  --glow: rgba(235, 227, 212, 0.035);
  --card-fill: rgba(235, 227, 212, 0.035);
  --user-fill: rgba(176, 154, 108, 0.07);
  --user-line: rgba(176, 154, 108, 0.28);
  --cite-rule: rgba(176, 154, 108, 0.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: clip; }
body {
  font-family: var(--font-body);
  color: var(--text);
  background: var(--ink);
  line-height: 1.6;
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 70% 50% at 50% -10%, var(--glow), transparent 58%);
}
:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }
button:active, .solid:active, .ghost:active, .composer button:active { filter: brightness(0.94); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.frame {
  position: relative; z-index: 1;
  max-width: var(--max); margin: 0 auto;
  min-height: 100vh;
  padding: calc(var(--space) * 4.5) calc(var(--space) * 3.5) calc(var(--space) * 3.5);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  gap: calc(var(--space) * 3);
}
.top {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: calc(var(--space) * 2.5);
  padding-bottom: calc(var(--space) * 2.5);
  border-bottom: 1px solid var(--gold-line);
}
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(2.35rem, 4.2vw, 3.15rem);
  color: var(--champagne);
  letter-spacing: 0.02em;
  line-height: 1.02;
  overflow-wrap: break-word; min-width: 0;
  text-wrap: balance;
}
.brand p {
  margin: 14px 0 0;
  font-size: 0.82rem;
  color: var(--mute);
  max-width: 40ch;
}
.top-actions {
  display: flex; gap: calc(var(--space) * 1.5); align-items: center; flex-wrap: wrap;
}
.ghost, .solid {
  font: inherit; font-size: 0.8rem; font-weight: 500;
  cursor: pointer; border-radius: var(--radius);
  padding: 0.55rem 1.05rem;
  transition: border-color .2s ease, background-color .2s ease, color .2s ease;
}
.ghost {
  background: transparent; color: var(--champagne-soft);
  border: 1px solid transparent;
  border-bottom: 1px solid var(--gold-line);
  border-radius: 0;
  padding-left: 0; padding-right: 0;
}
.ghost:hover { color: var(--champagne); border-bottom-color: var(--gold-line-strong); }
.solid {
  background: transparent; color: var(--ink);
  border: 1px solid var(--champagne);
  background: var(--champagne);
}
.solid:hover { background: var(--champagne-soft); }
.meta {
  font-size: 0.74rem; color: var(--mute);
  padding: 0;
  border: none;
}
.faq {
  display: flex; flex-wrap: wrap; gap: calc(var(--space) * 1) calc(var(--space) * 2);
}
.faq button {
  font: inherit; font-size: 0.8rem; cursor: pointer;
  background: transparent; color: var(--mute);
  border: none;
  padding: 0.25rem 0;
  border-bottom: 1px solid transparent;
}
.faq button:hover, .faq button.active {
  color: var(--champagne);
  border-bottom-color: var(--gold-line-strong);
}
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(220px, 0.7fr);
  gap: calc(var(--space) * 3.5);
  min-height: 0;
}
.lounge {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
  display: flex; flex-direction: column; gap: calc(var(--space) * 2.75);
  min-width: 0;
}
.msg { max-width: 82%; }
.msg.user { align-self: flex-end; }
.msg .who {
  font-size: 0.68rem; color: var(--mute); margin-bottom: 8px;
}
.msg.user .who { text-align: right; }
.card {
  background: var(--card-fill);
  border: 1px solid var(--gold-line);
  border-radius: var(--radius);
  padding: calc(var(--space) * 2.25) calc(var(--space) * 2.5);
  color: var(--text);
  font-size: 0.95rem;
}
.msg.user .card {
  background: var(--user-fill);
  border-color: var(--user-line);
}
.card strong { color: var(--champagne); font-weight: 600; }
.card.refuse {
  background: var(--danger-fill);
  border-color: rgba(201, 137, 124, 0.28);
}
.refuse-title {
  margin: 0 0 10px;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--danger);
}
.refuse-actions { margin-top: 16px; }
.silk {
  background: var(--ink-2);
  border: none;
  border-left: 1px solid var(--gold-line);
  border-radius: 0;
  padding: calc(var(--space) * 0.5) 0 calc(var(--space) * 0.5) calc(var(--space) * 2.75);
  display: flex; flex-direction: column; gap: calc(var(--space) * 2);
  min-width: 0;
}
.silk h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.25rem;
  color: var(--champagne-soft);
  letter-spacing: 0.03em;
  overflow-wrap: break-word; min-width: 0;
  text-wrap: balance;
}
.silk .sub {
  margin: 0;
  font-size: 0.72rem;
  color: var(--mute);
}
.cite {
  padding: 0 0 calc(var(--space) * 1.75);
  border-bottom: 1px solid var(--cite-rule);
}
.cite:last-of-type { border-bottom: none; padding-bottom: 0; }
.cite .t {
  font-size: 0.78rem; font-weight: 500; color: var(--champagne-soft);
}
.cite .score {
  display: block; margin-top: 4px;
  font-size: 0.7rem; color: var(--mute); font-weight: 400;
}
.cite .s {
  margin-top: 12px;
  font-size: 0.8rem;
  color: var(--mute);
  line-height: 1.55;
}
.composer {
  margin-top: auto;
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: calc(var(--space) * 1.25);
  padding-top: calc(var(--space) * 2.5);
  border-top: 1px solid var(--gold-line);
}
.composer input {
  font: inherit; color: var(--text);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--gold-line);
  border-radius: 0;
  padding: 0.75rem 0; min-width: 0;
}
.composer input::placeholder { color: var(--mute); }
.composer input:focus { outline: none; border-bottom-color: var(--gold-line-strong); }
.composer button {
  font: inherit; font-weight: 600; cursor: pointer;
  background: transparent; color: var(--champagne);
  border: 1px solid var(--gold-line-strong);
  border-radius: var(--radius);
  padding: 0 1.2rem;
}
.composer button:hover { border-color: var(--champagne); }
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: var(--ink-3); color: var(--champagne);
  border: 1px solid var(--gold-line);
  padding: 8px 16px; font-size: 0.82rem;
  opacity: 0; transition: opacity .2s ease; z-index: 5; pointer-events: none;
}
.toast.show { opacity: 1; }
@media (max-width: 860px) {
  .workspace { grid-template-columns: 1fr; gap: calc(var(--space) * 2.5); }
  .silk {
    border-left: none;
    border-top: 1px solid var(--gold-line);
    padding: calc(var(--space) * 2.5) 0 0;
  }
  .top { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  .ghost, .solid, .toast { transition: none; }
}
</style>
</head>
<body>
  <div class="frame">
    <header class="top">
      <div class="brand">
        <h1>星云客服</h1>
        <p>疏夜贵宾席 · 弱化描边 · 校园办事 / 方案 E4 · 模拟<br />沈凯杰、王瑞康</p>
      </div>
      <div class="top-actions">
        <span class="meta">知识库在线</span>
        <button type="button" class="ghost" id="btnTicket">转人工</button>
      </div>
    </header>
    <div class="faq" id="faq" role="group" aria-label="快捷问题">
      <button type="button" class="active" data-q="在读证明如何办理？">在读证明如何办理？</button>
      <button type="button" data-q="图书馆开放时间是什么？">图书馆开放时间是什么？</button>
      <button type="button" data-q="校园网如何认证登录？">校园网如何认证登录？</button>
      <button type="button" data-q="宿舍报修怎么提交？">宿舍报修怎么提交？</button>
    </div>
    <div class="workspace">
      <section class="lounge" aria-label="对话区">
        <div class="msg user">
          <div class="who">同学</div>
          <div class="card">在读证明如何办理？</div>
        </div>
        <div class="msg bot">
          <div class="who">星云客服</div>
          <div class="card">
            在读证明可在<strong>一网通办</strong>提交，<strong>3 个工作日</strong>办结；也可到教务处窗口领取。请携带校园卡，代办需书面委托。
          </div>
        </div>
        <div class="msg bot">
          <div class="who">星云客服</div>
          <div class="card refuse">
            <p class="refuse-title">知识库未覆盖</p>
            找不到可引用依据，已拒答。库外问题请转人工坐席。
            <div class="refuse-actions">
              <button type="button" class="solid" id="btnTicket2">转人工坐席</button>
            </div>
          </div>
        </div>
        <form class="composer" id="composer" onsubmit="return false;">
          <input id="q" type="text" placeholder="轻声提问…" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
      </section>
      <aside class="silk" aria-label="引用来源">
        <h2>出处</h2>
        <p class="sub">本轮依据</p>
        <div class="cite">
          <div class="t">客服样例FAQ.md</div>
          <span class="score">相关度 0.86</span>
          <div class="s">在读证明可通过一网通办提交，3 个工作日办结；窗口领取请带校园卡。</div>
        </div>
        <div class="cite">
          <div class="t">模拟说明</div>
          <div class="s">静态原型，不请求业务引擎。</div>
        </div>
      </aside>
    </div>
  </div>
  <div class="toast" id="toast">模拟交互</div>
  <script>
    const toast = document.getElementById('toast');
    function ping(m){ toast.textContent=m; toast.classList.add('show'); clearTimeout(window.__t); window.__t=setTimeout(()=>toast.classList.remove('show'),1600); }
    document.getElementById('faq').addEventListener('click', e => {
      const b = e.target.closest('button[data-q]'); if(!b) return;
      document.querySelectorAll('#faq button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); document.getElementById('q').value=b.dataset.q; ping('已选快捷问题（模拟）');
    });
    document.getElementById('composer').onsubmit = () => ping('发送为模拟，未请求引擎');
    document.getElementById('btnTicket').onclick = () => ping('转人工演示（模拟）');
    document.getElementById('btnTicket2').onclick = () => ping('转人工演示（模拟）');
  </script>
</body>
</html>
