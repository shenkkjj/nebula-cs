<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>管理登录 · 青岛理工大学校园办事助手</title>
  <link rel="stylesheet" href="/fonts/fonts.css?v=20261117b" />
  <link rel="stylesheet" href="/campus.css?v=20261121" />
  <link rel="stylesheet" href="/staff.css?v=20261121" />
</head>
<body class="login-page qut-staff">
  <header class="topbar">
    <a class="brandmark" href="/" aria-label="校园办事助手首页">
      <span class="brandmark-icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#school" /></svg></span>
      <strong>青岛理工大学</strong>
    </a>
    <a class="btn btn-quiet btn-sm" href="/">校园问答</a>
  </header>
  <main class="login-wrap">
    <h1 class="page-title">管理登录</h1>
    <form id="loginForm">
      <label class="field"><span>账号</span><input class="input" name="username" autocomplete="username" required maxlength="40" /></label>
      <label class="field"><span>密码</span><input class="input" name="password" type="password" autocomplete="current-password" required maxlength="80" /></label>
      <p class="err" id="loginError" role="alert" hidden></p>
      <button class="btn btn-solid" type="submit">登录</button>
    </form>
  </main>
  <script src="/login.js?v=20261121" defer></script>
</body>
</html>
