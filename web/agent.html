<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>坐席工作台 · 校园客服</title>
  <meta name="theme-color" content="#f7f8f3" />
  <link rel="stylesheet" href="/fonts/fonts.css?v=20261117b" />
  <link rel="stylesheet" href="/campus.css?v=20261118" />
  <link rel="stylesheet" href="/staff.css?v=20261118" />
</head>
<body class="desk-page">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar">
    <a class="brandmark" href="/" aria-label="校园客服首页">
      <span class="brandmark-icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#school" /></svg></span>
      <span><strong>校园客服</strong><small>星云大学 · 模拟校园</small></span>
    </a>
    <div class="top-actions">
      <span class="pill" id="kbPill">知识库状态待查</span>
      <span class="who" id="who">坐席</span>
      <button type="button" class="btn btn-quiet btn-sm" id="btnLogout"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#logout" /></svg>退出</button>
    </div>
  </header>
  <main class="s-agent" id="main" tabindex="-1">
    <div class="page-head desk-heading"><div><h1 class="page-title">坐席工作台</h1><p class="page-sub">接入访客会话，跟进并结束工单。</p></div></div>
    <div class="desk">
      <aside class="panel queue" aria-labelledby="q-title">
        <div class="panel-head"><h2 class="panel-title" id="q-title"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#inbox" /></svg>工单队列</h2><span class="small muted" id="queueStatus" role="status">每 5 秒刷新</span></div>
        <div class="seg" role="tablist" aria-label="工单状态">
          <button type="button" role="tab" id="tab-waiting" data-status="waiting" aria-controls="queue" aria-selected="true">待接入</button>
          <button type="button" role="tab" id="tab-active" data-status="active" aria-controls="queue" aria-selected="false" tabindex="-1">处理中</button>
          <button type="button" role="tab" id="tab-closed" data-status="closed" aria-controls="queue" aria-selected="false" tabindex="-1">已结束</button>
        </div>
        <div class="list" id="queue" role="tabpanel" aria-labelledby="tab-waiting"></div>
      </aside>
      <section class="panel conv" aria-labelledby="c-title">
        <div class="conv-head">
          <div>
            <h2 class="panel-title" id="c-title" tabindex="-1">访客对话</h2>
            <p class="small muted" id="c-sub">当前没有选中的工单</p>
          </div>
          <div class="top-actions">
            <span class="badge" id="c-badge" hidden></span>
            <button type="button" class="btn btn-solid btn-sm" id="btnTake" hidden>接入工单</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btnClose" hidden>结束工单</button>
          </div>
        </div>
        <div class="thread" id="thread" aria-label="对话记录"><div class="empty"><span class="mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#chat" /></svg></span><p>从队列选择工单以查看对话。</p></div></div>
        <form class="composer" id="replyForm" hidden>
          <label class="sr-only" for="reply">回复访客</label>
          <textarea class="textarea" id="reply" rows="1" maxlength="800" required placeholder="回复访客，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="btn btn-solid" type="submit"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#send" /></svg>发送</button>
        </form>
        <p class="form-status" id="replyStatus" role="status" hidden></p>
      </section>
      <aside class="panel ctx" aria-label="判定与工单操作">
        <div class="panel-head"><h2 class="panel-title"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#file" /></svg>处理详情</h2></div>
        <div class="tabs" role="tablist" aria-label="工单操作">
          <button type="button" role="tab" id="tab-trace" data-panel="trace" aria-controls="panel-trace" aria-selected="true">判定</button>
          <button type="button" role="tab" id="tab-write" data-panel="write" aria-controls="panel-write" aria-selected="false" tabindex="-1">知识库回写</button>
          <button type="button" role="tab" id="tab-bad" data-panel="bad" aria-controls="panel-bad" aria-selected="false" tabindex="-1">标记坏例</button>
        </div>
        <div class="tabpanel" id="panel-trace" role="tabpanel" aria-labelledby="tab-trace"><div class="empty"><span class="mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#file" /></svg></span><p>选择工单后可查看助手的答复判定。</p></div></div>
        <div class="tabpanel" id="panel-write" role="tabpanel" aria-labelledby="tab-write" hidden>
          <form id="writeForm">
            <p class="small muted">写入后成为一篇独立文档，来源标「坐席回写」。管理员可以删除。</p>
            <label class="field"><span>问题</span><input class="input" name="question" required maxlength="120" /></label>
            <label class="field"><span>标准答法</span><textarea class="textarea" name="answer" rows="6" required maxlength="800"></textarea></label>
            <div class="form-actions"><button class="btn btn-solid" type="submit">写入知识库</button></div>
            <p class="form-status" id="writeStatus" role="status" hidden></p>
          </form>
        </div>
        <div class="tabpanel" id="panel-bad" role="tabpanel" aria-labelledby="tab-bad" hidden>
          <form id="badForm">
            <p class="small muted" id="badTarget">先在对话里点一条机器人回答。</p>
            <input type="hidden" name="message_id" id="badMessage" />
            <fieldset class="radio-list">
              <legend class="legend">问题类型</legend>
              <label><input type="radio" name="kind" value="wrong" required /> 答错</label>
              <label><input type="radio" name="kind" value="cite" /> 引用不对</label>
              <label><input type="radio" name="kind" value="miss-refuse" /> 该拒没拒</label>
              <label><input type="radio" name="kind" value="over-refuse" /> 不该拒却拒</label>
              <label><input type="radio" name="kind" value="other" /> 其他</label>
            </fieldset>
            <label class="field"><span>期望结果（选填）</span><textarea class="textarea" name="expect" rows="3" maxlength="400"></textarea></label>
            <div class="form-actions"><button class="btn btn-solid" type="submit">加入评测集</button></div>
            <p class="form-status" id="badStatus" role="status" hidden></p>
          </form>
        </div>
      </aside>
    </div>
  </main>
  <dialog id="closeDialog" aria-labelledby="closeTitle">
    <form id="closeForm">
      <div class="panel-head"><h2 class="panel-title" id="closeTitle">结束工单</h2><button type="button" class="icon-btn" id="closeCancel" aria-label="关闭">×</button></div>
      <div class="panel-body">
        <label class="field"><span>处理说明（必填）</span><textarea class="textarea" name="note" rows="3" required maxlength="300" placeholder="例如：已告知办理窗口，并回写知识库"></textarea></label>
        <p class="err" id="closeError" hidden></p>
        <div class="form-actions"><button type="button" class="btn btn-ghost" id="closeDismiss">取消</button><button type="submit" class="btn btn-solid">结束工单</button></div>
      </div>
    </form>
  </dialog>
  <script src="/agent.js?v=20261118" defer></script>
</body>
</html>
