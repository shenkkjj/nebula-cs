<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>青岛理工大学 · 校园办事助手</title>
  <meta name="description" content="基于青岛理工大学公开资料的非官方校园办事助手。" />
  <link rel="stylesheet" href="/fonts/fonts.css?v=20261117b" />
  <link rel="stylesheet" href="/campus.css?v=20261121" />
  <link rel="stylesheet" href="/portal.css?v=20261121" />
</head>
<body class="portal">
  <a class="skip-link" href="#assistant">跳到校园问答</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brandmark" href="/" aria-label="青岛理工大学校园办事助手首页">
        <span class="brandmark-icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#school" /></svg></span>
        <strong>青岛理工大学</strong>
      </a>
      <nav class="site-nav" aria-label="服务入口">
        <button type="button" class="btn btn-quiet" id="btnNav" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#book" /></svg>办事指南</button>
        <a class="btn btn-quiet" href="/login" title="管理后台"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#lock" /></svg><span>管理后台</span></a>
      </nav>
    </div>
  </header>

  <main class="workspace" id="main">
    <aside class="history-rail" aria-labelledby="historyTitle">
      <button class="btn new-chat" type="button" data-command="new"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#plus" /></svg>新对话</button>
      <h2 id="historyTitle">本机对话</h2>
      <div class="session-list" id="sessionList"></div>
    </aside>

    <section class="chat-panel" id="assistant" aria-labelledby="assistantTitle" tabindex="-1">
      <header class="chat-head">
        <h1 id="assistantTitle">校园办事助手</h1>
        <div class="chat-actions">
          <div class="audience" role="group" aria-label="办事对象">
            <button type="button" data-audience="student" aria-pressed="true">学生</button>
            <button type="button" data-audience="staff" aria-pressed="false">教职工</button>
          </div>
          <button class="icon-btn mobile-history" type="button" id="btnHistory" aria-label="本机对话" title="本机对话" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#history" /></svg></button>
          <button class="icon-btn" type="button" id="btnExport" aria-label="导出当前对话" title="导出当前对话" hidden><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#download" /></svg></button>
        </div>
      </header>
      <p id="noticeBar" class="notice-bar" role="status" hidden></p>
      <div class="chat-content" id="chatContent">
        <section class="empty-state" id="emptyState" aria-labelledby="welcomeTitle">
          <span class="ask-icon" aria-hidden="true"><svg class="icon"><use href="/assets/icons.svg#chat" /></svg></span>
          <h2 id="welcomeTitle">今天想办什么？</h2>
          <div class="quick-questions" id="quickQuestions" aria-label="常见问题"></div>
        </section>
        <div class="messages" id="messages" role="log" aria-label="对话消息" hidden></div>
      </div>
      <form class="composer" id="composer">
        <label class="sr-only" for="queryInput">输入校园办事问题</label>
        <div class="compose-field">
          <textarea id="queryInput" rows="1" maxlength="2000" placeholder="输入校园办事问题" autocomplete="off" aria-keyshortcuts="Enter Shift+Enter"></textarea>
          <button type="button" class="btn" id="btnStop" hidden>停止</button>
          <button type="submit" class="icon-btn btn-solid" id="btnSend" aria-label="发送" title="发送" disabled><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#arrow-up" /></svg></button>
        </div>
        <p id="statusText" class="sr-only" role="status"></p>
      </form>
    </section>

    <aside class="guide-rail" aria-labelledby="serviceTitle">
      <h2 id="serviceTitle">办事入口</h2>
      <div class="official-links">
        <a href="https://www.qut.edu.cn/" target="_blank" rel="noopener noreferrer"><span class="guide-icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#school" /></svg></span>学校官网<svg class="icon outgoing" aria-hidden="true"><use href="/assets/icons.svg#arrow-up-right" /></svg></a>
        <a href="https://www.qut.edu.cn/zzjg.htm" target="_blank" rel="noopener noreferrer"><span class="guide-icon teal"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#grid" /></svg></span>部门目录<svg class="icon outgoing" aria-hidden="true"><use href="/assets/icons.svg#arrow-up-right" /></svg></a>
        <a href="https://cwc.qut.edu.cn/sfgs.htm" target="_blank" rel="noopener noreferrer"><span class="guide-icon amber"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#file" /></svg></span>收费公示<svg class="icon outgoing" aria-hidden="true"><use href="/assets/icons.svg#arrow-up-right" /></svg></a>
      </div>
      <p class="site-note">非校方官方平台</p>
    </aside>
  </main>

  <dialog id="navModal" aria-labelledby="navTitle">
    <header class="dialog-head"><h2 id="navTitle">办事指南</h2><button type="button" class="icon-btn" data-close aria-label="关闭"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#close" /></svg></button></header>
    <div class="dialog-body">
      <label class="sr-only" for="navSearch">搜索办事指南</label>
      <input class="input" id="navSearch" type="search" placeholder="搜索办事指南" autocomplete="off" autofocus />
      <div class="nav-cats" id="navCats" role="group" aria-label="办事分类"></div>
      <div class="nav-list" id="navList"></div>
    </div>
  </dialog>

  <dialog id="sourcePanel" aria-labelledby="sourceTitle">
    <header class="dialog-head"><h2 id="sourceTitle">答复出处</h2><button type="button" class="icon-btn" data-close aria-label="关闭" autofocus><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#close" /></svg></button></header>
    <div class="dialog-body cite-list" id="citeList"></div>
  </dialog>

  <dialog id="historyModal" aria-labelledby="mobileHistoryTitle">
    <header class="dialog-head"><h2 id="mobileHistoryTitle">本机对话</h2><button type="button" class="icon-btn" data-close aria-label="关闭" autofocus><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#close" /></svg></button></header>
    <div class="dialog-body">
      <button type="button" class="btn new-chat" data-command="new"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#plus" /></svg>新对话</button>
      <div class="session-list" id="mobileSessions"></div>
    </div>
  </dialog>
  <script src="/mask.js?v=20261117b" defer></script>
  <script src="/app.js?v=20261121" defer></script>
</body>
</html>
